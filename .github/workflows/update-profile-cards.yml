name: Update profile cards

on:
  # the card options live in this file, so a change to them redraws the cards
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-profile-cards.yml

  schedule:
    # Run every week on Sunday at 05:37 UTC, off the peak windows described in
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
    #        ┌───────────── minute (0 - 59)
    #        │  ┌───────────── hour (0 - 23)
    #        │  │ ┌───────────── day of the month (1 - 31)
    #        │  │ │ ┌───────────── month (1 - 12 or JAN-DEC)
    #        │  │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
    #        │  │ │ │ │
    #        *  * * * *
    - cron: '37 5 * * 0'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build profile cards and open PR

    if: github.repository == 'stats-forge/.github'

    runs-on: ubuntu-latest

    environment: update-card-files

    permissions:
      contents: read # the app token, not GITHUB_TOKEN, pushes the branch and opens the PR

    env:
      INFO_DARK_CARD: profile/org-info-dark.svg
      INFO_LIGHT_CARD: profile/org-info-light.svg
      ACTIVITY_DARK_CARD: profile/org-activity-dark.svg
      ACTIVITY_LIGHT_CARD: profile/org-activity-light.svg
      # Shared card options, only the theme differs between the dark and light card.
      # What is open belongs to the activity card, so the info card leaves it out and the two stay the same size.
      INFO_CARD_OPTIONS: org=${{ github.repository_owner }}&show_icons=true&number_format=long&show=releases,commits,top_language&hide=forks,watchers,open_issues,open_prs&hide_description=true
      # card_width matches the info card, so the two sit side by side in the profile README
      ACTIVITY_CARD_OPTIONS: org=${{ github.repository_owner }}&show_icons=true&number_format=long&days=30&show=commits&card_width=400

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A GitHub App token, not GITHUB_TOKEN: events from the default token do not
      # start other workflows, so nothing would run on the generated PR.
      - name: Setup credentials
        id: credentials
        uses: marcalexiei/github-actions/setup-github-app-user-bot@e3b04865510c657477cc722854b31a3b74c72c09 # v2.2.0
        with:
          app-id: ${{ vars.HELPER_APP_ID }}
          private-key: ${{ secrets.HELPER_PRIVATE_KEY }}

      - name: Generate organization info card (dark) - ${{ env.INFO_DARK_CARD }}
        uses: stats-forge/github-stats-forge-action@635c19487c577abae4a260d8b40c135b4e9f7965 # v0.7.0
        with:
          card: org
          options: ${{ env.INFO_CARD_OPTIONS }}&theme=react
          path: ${{ env.INFO_DARK_CARD }}
          token: ${{ steps.credentials.outputs.token }}

      - name: Generate organization info card (light) - ${{ env.INFO_LIGHT_CARD }}
        uses: stats-forge/github-stats-forge-action@635c19487c577abae4a260d8b40c135b4e9f7965 # v0.7.0
        with:
          card: org
          options: ${{ env.INFO_CARD_OPTIONS }}&theme=default
          path: ${{ env.INFO_LIGHT_CARD }}
          token: ${{ steps.credentials.outputs.token }}

      - name: Generate organization activity card (dark) - ${{ env.ACTIVITY_DARK_CARD }}
        uses: stats-forge/github-stats-forge-action@635c19487c577abae4a260d8b40c135b4e9f7965 # v0.7.0
        with:
          card: org-activity
          options: ${{ env.ACTIVITY_CARD_OPTIONS }}&theme=react
          path: ${{ env.ACTIVITY_DARK_CARD }}
          token: ${{ steps.credentials.outputs.token }}

      - name: Generate organization activity card (light) - ${{ env.ACTIVITY_LIGHT_CARD }}
        uses: stats-forge/github-stats-forge-action@635c19487c577abae4a260d8b40c135b4e9f7965 # v0.7.0
        with:
          card: org-activity
          options: ${{ env.ACTIVITY_CARD_OPTIONS }}&theme=default
          path: ${{ env.ACTIVITY_LIGHT_CARD }}
          token: ${{ steps.credentials.outputs.token }}

      - name: Create Pull Request
        id: create_pr
        # zizmor: ignore[superfluous-actions] -- this action also handles git commit and branch push, not just PR creation
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.credentials.outputs.token }}
          branch: update-profile-cards
          title: ${{ env.COMMIT_MESSAGE }}
          commit-message: ${{ env.COMMIT_MESSAGE }}
          body: |
            Scheduled cards update

            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          author: ${{ env.AUTHOR }}
          committer: ${{ env.AUTHOR }}
          sign-commits: true
          delete-branch: true # avoid multiple PRs
        env:
          COMMIT_MESSAGE: 'feat: update profile cards'
          AUTHOR: ${{ steps.credentials.outputs.bot-name }} <${{ steps.credentials.outputs.bot-email }}>

      - name: Enable auto-merge
        if: ${{ steps.create_pr.outputs.pull-request-number }} # PR might not being opened
        run: gh pr merge --squash --auto "${PULL_REQUEST_NUMBER}"
        env:
          GH_TOKEN: ${{ steps.credentials.outputs.token }}
          PULL_REQUEST_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
